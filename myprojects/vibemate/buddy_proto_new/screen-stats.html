<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buddy — 属性</title>
  <style>
    :root {
      --d: 360px; --r: 180px; --safe: 16px;
      --bg: #0A0A0F;
      --surface: #13131A;
      --fg: #E8E8ED;
      --muted: #6B6B78;
      --border: #252530;
      --accent: #3DD9D0;
      --accent-dim: rgba(61, 217, 208, 0.12);
      --btn-active: #2A2A38;
      --r-common: #8A8A95;
      --r-uncommon: #5EE7DF;
      --r-rare: #6B8CFF;
      --r-epic: #C85EFF;
      --r-legendary: #FFD166;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      display: grid; place-items: center;
      background: #050508;
      font-family: var(--font);
      overflow: hidden;
    }
    .lv-display {
      width: var(--d); height: var(--d);
      border-radius: 50%; overflow: hidden;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 0 2px var(--border), 0 20px 80px rgba(0,0,0,0.6);
    }
    .lv-label { color: var(--fg); font-size: 10px; line-height: 1.3; }
    .lv-label.muted { color: var(--muted); }
    .lv-label.title { font-size: 11px; font-weight: 600; }
    .lv-label.mono { font-family: var(--font-mono); }
    .lv-label.stat-name { font-size: 7px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .lv-label.stat-val { font-size: 10px; font-weight: 600; font-family: var(--font-mono); }

    .lv-btn {
      display: grid; place-items: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .lv-btn:active { background: var(--btn-active); transform: scale(0.92); }

    .lv-line { height: 1px; background: var(--border); }

    .screen {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      padding: var(--safe);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* Header avatar + name */
    .header {
      margin-top: 12px;
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }
    .avatar-ring {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: grid; place-items: center;
      background: var(--surface);
    }
    .avatar-ring .face {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
    }
    .rarity-badge {
      font-size: 7px;
      padding: 2px 7px;
      border-radius: 8px;
      background: var(--accent-dim);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    /* Stats grid — 5 arcs, compact */
    .stats-grid {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 248px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* LVGL arc → SVG ring */
    .arc-wrap {
      position: relative;
      width: 22px; height: 22px;
      flex-shrink: 0;
    }
    .arc-wrap svg {
      transform: rotate(-90deg);
    }
    .arc-wrap .arc-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 2.5;
    }
    .arc-wrap .arc-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s ease;
    }
    .arc-wrap .arc-center {
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
    }
    .arc-wrap .arc-center .lv-label {
      font-size: 7px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .stat-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-bar-track {
      width: 100%;
      height: 2px;
      border-radius: 1px;
      background: var(--border);
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--accent), #7AECD9);
      transition: width 0.8s ease;
    }

    /* Metadata row */
    .meta-grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      width: 248px;
    }
    .meta-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .meta-item .lv-label:first-child { font-size: 7px; }
    .meta-item .lv-label:last-child { font-size: 9px; font-weight: 500; }

    /* Page dots */
    .page-dots {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 5px;
    }
    .page-dots .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .page-dots .dot.active { background: var(--accent); }

    .r-common { color: var(--r-common); }
    .r-uncommon { color: var(--r-uncommon); }
    .r-rare { color: var(--r-rare); }
    .r-epic { color: var(--r-epic); }
    .r-legendary { color: var(--r-legendary); }
  </style>
</head>
<body>
  <div class="lv-display">
    <div class="screen">
      <!-- Header -->
      <div class="header">
        <div class="avatar-ring">
          <div class="face" id="avatar-face">=✦ω✦=</div>
        </div>
        <div class="lv-label title" id="pet-name">Mochi</div>
        <div class="rarity-badge" id="rarity-badge">Rare</div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid"></div>

      <!-- Metadata -->
      <div class="meta-grid">
        <div class="meta-item">
          <div class="lv-label muted mono">SPECIES</div>
          <div class="lv-label" id="meta-species">cat</div>
        </div>
        <div class="meta-item">
          <div class="lv-label muted mono">EYE</div>
          <div class="lv-label" id="meta-eye">✦</div>
        </div>
        <div class="meta-item">
          <div class="lv-label muted mono">HAT</div>
          <div class="lv-label" id="meta-hat">beanie</div>
        </div>
        <div class="meta-item">
          <div class="lv-label muted mono">SHINY</div>
          <div class="lv-label" id="meta-shiny">Yes</div>
        </div>
      </div>

      <!-- Page dots -->
      <div class="page-dots">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    const STAT_NAMES = ['DEBUGGING', 'PATIENCE', 'CHAOS', 'WISDOM', 'SNARK'];

    const demoCompanion = {
      name: 'Mochi',
      species: 'cat',
      eye: '✦',
      hat: 'beanie',
      shiny: true,
      rarity: 'rare',
      stats: {
        DEBUGGING: 78,
        PATIENCE: 34,
        CHAOS: 62,
        WISDOM: 55,
        SNARK: 89,
      },
    };

    const FACE_MAP = {
      duck: '(·>)', goose: '(·>)', blob: '(··)', cat: '=✦ω✦=',
      dragon: '<✦~✦>', octopus: '~(✦✦)~', owl: '(✦)(✦)',
      penguin: '(✦>)', turtle: '[✦_✦]', snail: '✦(@)',
      ghost: '/✦✦\\', axolotl: '}✦.✦{', capybara: '(✦oo✦)',
      cactus: '|✦  ✦|', robot: '[✦✦]', rabbit: '(✦..✦)',
      mushroom: '|✦  ✦|', chonk: '(✦.✦)',
    };

    function renderArc(value, label) {
      const r = 9;
      const c = 2 * Math.PI * r;
      const offset = c - (value / 100) * c;
      return `
        <div class="arc-wrap">
          <svg width="22" height="22" viewBox="0 0 22 22">
            <circle class="arc-bg" cx="11" cy="11" r="${r}"/>
            <circle class="arc-fill" cx="11" cy="11" r="${r}"
              stroke-dasharray="${c}"
              stroke-dashoffset="${offset}"/>
          </svg>
          <div class="arc-center"><span class="lv-label">${value}</span></div>
        </div>
      `;
    }

    function renderStats() {
      const grid = document.getElementById('stats-grid');
      const stats = demoCompanion.stats;

      STAT_NAMES.forEach((name, i) => {
        const val = stats[name];
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          ${renderArc(0, name)}
          <div class="stat-info">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="lv-label stat-name">${name}</span>
              <span class="lv-label stat-val">${val}</span>
            </div>
            <div class="stat-bar-track">
              <div class="stat-bar-fill" style="width:0%"></div>
            </div>
          </div>
        `;
        grid.appendChild(row);

        // Animate after mount
        setTimeout(() => {
          const arcFill = row.querySelector('.arc-fill');
          const r = 9;
          const c = 2 * Math.PI * r;
          arcFill.style.strokeDashoffset = c - (val / 100) * c;
          row.querySelector('.stat-bar-fill').style.width = val + '%';
        }, 100 + i * 80);
      });
    }

    // Init
    document.getElementById('pet-name').textContent = demoCompanion.name;
    document.getElementById('rarity-badge').textContent = demoCompanion.rarity;
    document.getElementById('rarity-badge').className = `rarity-badge r-${demoCompanion.rarity}`;
    document.getElementById('avatar-face').textContent = FACE_MAP[demoCompanion.species] || '=✦ω✦=';
    document.getElementById('meta-species').textContent = demoCompanion.species;
    document.getElementById('meta-eye').textContent = demoCompanion.eye;
    document.getElementById('meta-hat').textContent = demoCompanion.hat;
    document.getElementById('meta-shiny').textContent = demoCompanion.shiny ? 'Yes' : 'No';
    renderStats();
  </script>
</body>
</html>
