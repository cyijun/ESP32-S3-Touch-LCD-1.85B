<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buddy — 交互</title>
  <style>
    :root {
      /* Canvas */
      --d: 360px;
      --r: 180px;
      --safe: 16px;

      /* Palette — dark minimal, OLED-friendly */
      --bg: #0A0A0F;
      --surface: #13131A;
      --fg: #E8E8ED;
      --muted: #6B6B78;
      --border: #252530;
      --accent: #3DD9D0;
      --accent-dim: rgba(61, 217, 208, 0.15);
      --btn-active: #2A2A38;

      /* Rarity */
      --r-common: #8A8A95;
      --r-uncommon: #5EE7DF;
      --r-rare: #6B8CFF;
      --r-epic: #C85EFF;
      --r-legendary: #FFD166;

      /* Typography */
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw; height: 100vh;
      display: grid; place-items: center;
      background: #050508;
      font-family: var(--font);
      overflow: hidden;
    }

    /* LVGL canvas: 360×360 circular display */
    .lv-display {
      width: var(--d); height: var(--d);
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 0 2px var(--border), 0 20px 80px rgba(0,0,0,0.6);
    }

    /* === LVGL Components === */

    /* lv_label */
    .lv-label {
      color: var(--fg);
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }
    .lv-label.muted { color: var(--muted); }
    .lv-label.title { font-size: 15px; font-weight: 600; }
    .lv-label.mono { font-family: var(--font-mono); }

    /* lv_btn */
    .lv-btn {
      display: grid; place-items: center;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .lv-btn:active { background: var(--btn-active); transform: scale(0.92); }
    .lv-btn.accent { background: var(--accent-dim); border-color: rgba(61,217,208,0.3); color: var(--accent); }
    .lv-btn.accent:active { background: rgba(61,217,208,0.25); }

    /* lv_arc → CSS conic-gradient ring */
    .lv-arc-track {
      position: relative;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--pct), var(--border) 0);
    }
    .lv-arc-track::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--bg);
    }

    /* lv_line */
    .lv-line {
      height: 1px;
      background: var(--border);
    }

    /* Speech bubble (lv_obj + lv_label composition) */
    .speech-bubble {
      position: absolute;
      top: 56px; left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 14px;
      max-width: 220px;
      text-align: center;
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .speech-bubble.show { transform: translateX(-50%) scale(1); }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -5px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 8px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      transform: translateX(-50%) rotate(45deg);
    }
    .speech-bubble .lv-label { font-size: 10px; }

    /* === Screen layout === */
    .screen {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      padding: var(--safe);
    }

    /* Header */
    .header {
      margin-top: 28px;
      text-align: center;
      z-index: 2;
    }
    .rarity-stars {
      font-size: 9px;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    /* Pet stage */
    .pet-stage {
      flex: 1;
      display: grid; place-items: center;
      position: relative;
      width: 100%;
    }

    /* Glowing ring behind pet */
    .pet-ring {
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      opacity: 0.5;
    }
    .pet-ring.pulse {
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.04); opacity: 0.7; }
    }

    /* Pet sprite container */
    .pet-sprite {
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.25;
      color: var(--fg);
      text-align: center;
      white-space: pre;
      z-index: 2;
      animation: spriteFloat 2.5s ease-in-out infinite;
    }
    .pet-sprite .eye { color: var(--accent); }
    .pet-sprite .hat { color: var(--accent); }
    .pet-sprite.shiny {
      text-shadow: 0 0 8px rgba(61,217,208,0.4);
    }

    @keyframes spriteFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Hat overlay */
    .hat-line {
      position: absolute;
      top: 68px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    /* Action bar */
    .action-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      z-index: 2;
    }
    .action-bar .lv-btn {
      position: relative;
    }
    .action-bar .lv-btn .label {
      position: absolute;
      bottom: -14px;
      font-size: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* Navigation hint */
    .nav-hint {
      position: absolute;
      bottom: 10px;
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* Mini stat bars under header */
    .mini-stats {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      z-index: 2;
    }
    .mini-stat {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mini-stat .icon { width: 10px; text-align: center; font-size: 10px; }
    .mini-stat .track {
      flex: 1;
      height: 4px;
      background: var(--surface);
      border-radius: 2px;
      overflow: hidden;
    }
    .mini-stat .fill {
      height: 100%;
      width: var(--w, 0%);
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.35s ease;
    }
    .mini-stat .val {
      width: 22px;
      text-align: right;
      font-size: 9px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* Floating effect overlays */
    .floater {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scale(0);
      pointer-events: none;
      z-index: 20;
    }
    .floater.show {
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { transform: translateX(-50%) translateY(0) scale(0.6); opacity: 0; }
      15%  { transform: translateX(-50%) translateY(-6px) scale(1.1); opacity: 1; }
      100% { transform: translateX(-50%) translateY(-44px) scale(1); opacity: 0; }
    }
    .food-bit {
      top: 120px;
      font-size: 18px;
    }
    .ball-bit {
      top: 130px;
      font-size: 16px;
    }
    .delta-bit {
      top: 90px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
    }

    /* Pet reaction states */
    .pet-sprite.wiggle {
      animation: spriteWiggle 0.45s ease-in-out;
    }
    @keyframes spriteWiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
      80% { transform: rotate(-4deg); }
    }
    .pet-sprite.jump {
      animation: spriteJump 0.55s ease-in-out;
    }
    @keyframes spriteJump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-28px); }
      70% { transform: translateY(4px); }
    }
    .pet-ring.fast {
      animation-duration: 0.7s;
    }

    /* Page dots */
    .page-dots {
      position: absolute;
      bottom: 24px;
      display: flex;
      gap: 6px;
    }
    .page-dots .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .page-dots .dot.active { background: var(--accent); }

    /* Hat picker menu */
    .hat-menu {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .hat-menu.open {
      opacity: 1;
      pointer-events: auto;
    }
    .hat-menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.75);
      border-radius: 50%;
      backdrop-filter: blur(2px);
    }
    .hat-menu-panel {
      position: relative;
      width: 248px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 12px 12px;
      text-align: center;
      z-index: 1;
    }
    .hat-menu-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 10px;
    }
    .hat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .hat-option {
      display: grid;
      place-items: center;
      height: 44px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .hat-option:active {
      background: var(--btn-active);
      transform: scale(0.95);
    }
    .hat-option.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }
    .hat-option .hat-label {
      font-size: 7px;
      color: var(--muted);
      margin-top: 2px;
      font-family: var(--font);
    }
    .hat-menu-close {
      margin-top: 10px;
      padding: 5px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 9px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .hat-menu-close:active {
      background: var(--btn-active);
    }

    /* Long-press indicator */
    .press-ring {
      position: absolute;
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }
    .press-ring.active {
      opacity: 0.5;
      animation: pressShrink 0.6s linear forwards;
    }
    @keyframes pressShrink {
      0%   { transform: scale(1.6); opacity: 0; }
      20%  { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.6; }
    }

    /* Rarity color helpers */
    .r-common { color: var(--r-common); }
    .r-uncommon { color: var(--r-uncommon); }
    .r-rare { color: var(--r-rare); }
    .r-epic { color: var(--r-epic); }
    .r-legendary { color: var(--r-legendary); }
  </style>
</head>
<body>
  <div class="lv-display">
    <div class="screen">
      <!-- Header -->
      <div class="header">
        <div class="lv-label title" id="pet-name">Mochi</div>
        <div class="rarity-stars r-rare" id="pet-rarity">★★★</div>
      </div>

      <!-- Mini stats -->
      <div class="mini-stats">
        <div class="mini-stat" aria-label="饱食度">
          <div class="icon">◐</div>
          <div class="track"><div class="fill" id="hunger-fill" style="--w:72%"></div></div>
          <div class="val" id="hunger-val">72</div>
        </div>
        <div class="mini-stat" aria-label="开心值">
          <div class="icon">♥</div>
          <div class="track"><div class="fill" id="joy-fill" style="--w:55%"></div></div>
          <div class="val" id="joy-val">55</div>
        </div>
      </div>

      <!-- Floating effects -->
      <div class="floater food-bit" id="food-bit">●</div>
      <div class="floater ball-bit" id="ball-bit">◯</div>
      <div class="floater delta-bit" id="delta-bit">+10</div>

      <!-- Speech bubble (hidden by default) -->
      <div class="speech-bubble" id="bubble">
        <div class="lv-label" id="bubble-text">在写 bug 呢？需要我帮忙吗？</div>
      </div>

      <!-- Pet stage -->
      <div class="pet-stage">
        <div class="pet-ring pulse"></div>
        <div class="hat-line" id="hat-line"></div>
        <div class="pet-sprite shiny" id="pet-sprite"></div>
      </div>

      <!-- Action bar -->
      <div class="action-bar">
        <button class="lv-btn" onclick="action('feed')" aria-label="喂食">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2C8 2 5 5 5 9c0 5 7 11 7 11s7-6 7-11c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span class="label">喂食</span>
        </button>
        <button class="lv-btn accent" onclick="action('talk')" aria-label="对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="label">对话</span>
        </button>
        <button class="lv-btn" onclick="action('play')" aria-label="玩耍">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span class="label">玩耍</span>
        </button>
      </div>

      <!-- Long-press indicator ring -->
      <div class="press-ring" id="press-ring"></div>

      <!-- Hat picker menu -->
      <div class="hat-menu" id="hat-menu">
        <div class="hat-menu-backdrop" onclick="closeHatMenu()"></div>
        <div class="hat-menu-panel">
          <div class="hat-menu-title">长按换帽</div>
          <div class="hat-grid" id="hat-grid"></div>
          <button class="hat-menu-close" onclick="closeHatMenu()">取消</button>
        </div>
      </div>

      <!-- Page dots -->
      <div class="page-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    // === Buddy system data (from sprites.ts / types.ts) ===
    const EYES = ['·', '✦', '×', '◉', '@', '°'];
    const HAT_LINES = {
      none: '',
      crown: '   \\^^^/    ',
      tophat: '   [___]    ',
      propeller: '    -+-     ',
      halo: '   (   )    ',
      wizard: '    /^\\     ',
      beanie: '   (___)    ',
      tinyduck: '    ,>      ',
    };

    // Simplified pet frames for 360px screen (5 lines, compact)
    const BODIES = {
      duck: [
        ['    __      ', '  <({E} )___  ', '   (  ._>   ', '    `--´    '],
        ['    __      ', '  <({E} )___  ', '   (  ._>   ', '    `--´~   '],
      ],
      cat: [
        ['   /\\_/\\    ', '  ( {E}   {E})  ', '  (  ω  )   ', '  (")_(")   '],
        ['   /\\_/\\    ', '  ( {E}   {E})  ', '  (  ω  )   ', '  (")_(")~  '],
      ],
      robot: [
        ['   .[||].   ', '  [ {E}  {E} ]  ', '  [ ==== ]  ', '  `------´  '],
        ['   .[||].   ', '  [ {E}  {E} ]  ', '  [ -==- ]  ', '  `------´  '],
      ],
      blob: [
        ['   .----.   ', '  ( {E}  {E} )  ', '  (      )  ', '   `----´   '],
        ['  .------.  ', ' (  {E}  {E}  ) ', ' (        ) ', '  `------´  '],
      ],
      dragon: [
        ['  /^\\  /^\\  ', ' <  {E}  {E}  > ', ' (   ~~   ) ', '  `-vvvv-´  '],
        ['  /^\\  /^\\  ', ' <  {E}  {E}  > ', ' (        ) ', '  `-vvvv-´  '],
      ],
      ghost: [
        ['   .----.   ', '  / {E}  {E} \\  ', '  |      |  ', '  ~`~``~`~  '],
        ['   .----.   ', '  / {E}  {E} \\  ', '  |      |  ', '  `~`~~`~`  '],
      ],
    };

    // Default companion demo
    const demoCompanion = {
      name: 'Mochi',
      species: 'cat',
      eye: '✦',
      hat: 'beanie',
      shiny: true,
      rarity: 'rare',
      personality: '冷静、毒舌、偶尔很暖',
    };

    // Stats (hunger / joy, 0–100)
    const stats = { hunger: 72, joy: 55 };

    let frameIdx = 0;
    let frameTimer = null;
    let reactionTimer = null;

    function setStat(key, delta) {
      const next = Math.min(100, Math.max(0, stats[key] + delta));
      stats[key] = next;
      document.getElementById(`${key}-fill`).style.setProperty('--w', `${next}%`);
      document.getElementById(`${key}-val`).textContent = String(next);
    }

    function showFloater(id, text) {
      const el = document.getElementById(id);
      if (text != null) el.textContent = text;
      el.classList.remove('show');
      void el.offsetWidth; // reflow
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1000);
    }

    function petReaction(cls) {
      const sprite = document.getElementById('pet-sprite');
      sprite.classList.remove('wiggle', 'jump');
      void sprite.offsetWidth;
      sprite.classList.add(cls);
      if (reactionTimer) clearTimeout(reactionTimer);
      reactionTimer = setTimeout(() => sprite.classList.remove(cls), 600);
    }

    function renderSprite(companion) {
      const frames = BODIES[companion.species] || BODIES.cat;
      const frame = frames[frameIdx % frames.length];
      const spriteEl = document.getElementById('pet-sprite');
      const hatEl = document.getElementById('hat-line');

      // Build body lines with colored eyes
      const bodyLines = frame.map(line => {
        return line.replace(/{E}/g, `<span class="eye">${companion.eye}</span>`);
      });

      // Assemble sprite: hat on top, then body
      const spriteLines = [];
      if (companion.hat !== 'none') {
        const hatText = HAT_LINES[companion.hat] || '';
        if (hatText.trim()) spriteLines.push(`<span class="hat">${hatText}</span>`);
      }
      spriteLines.push(...bodyLines);

      spriteEl.innerHTML = spriteLines.join('\n');
      spriteEl.classList.toggle('shiny', companion.shiny);

      // Clear separate hat overlay — hat is now inline with the sprite
      hatEl.textContent = '';
    }

    function startAnimation() {
      if (frameTimer) clearInterval(frameTimer);
      frameTimer = setInterval(() => {
        frameIdx++;
        renderSprite(demoCompanion);
      }, 800);
    }

    // Actions
    const MESSAGES = [
      '在写 bug 呢？需要我帮忙吗？',
      '你的代码风格…挺有创意的。',
      '休息一下吧，眼睛会感谢你的。',
      '这个变量名是认真的吗？',
      '加油，离 commit 还有 47 个文件。',
      '我看好你，真的。',
    ];
    const FEED_RESPONSES = ['咕噜…', '好吃。', '再来一口。', '满足了。'];
    const PLAY_RESPONSES = ['好快！', '接着！', '开心。', '耶！'];

    function action(type) {
      if (type === 'talk') {
        const bubble = document.getElementById('bubble');
        const text = document.getElementById('bubble-text');
        text.textContent = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
        bubble.classList.add('show');
        setTimeout(() => bubble.classList.remove('show'), 3000);
      } else if (type === 'feed') {
        showFloater('food-bit');
        showFloater('delta-bit', '+Hunger');
        petReaction('wiggle');
        setStat('hunger', 8);
        // Companion reacts with a short speech after swallowing
        setTimeout(() => {
          const bubble = document.getElementById('bubble');
          document.getElementById('bubble-text').textContent = FEED_RESPONSES[Math.floor(Math.random() * FEED_RESPONSES.length)];
          bubble.classList.add('show');
          setTimeout(() => bubble.classList.remove('show'), 1800);
        }, 400);
      } else if (type === 'play') {
        showFloater('ball-bit');
        showFloater('delta-bit', '+Joy');
        petReaction('jump');
        setStat('joy', 10);
        const ring = document.querySelector('.pet-ring');
        ring.classList.add('fast');
        ring.style.borderColor = 'var(--accent)';
        setTimeout(() => {
          ring.classList.remove('fast');
          ring.style.borderColor = '';
        }, 900);
        setTimeout(() => {
          const bubble = document.getElementById('bubble');
          document.getElementById('bubble-text').textContent = PLAY_RESPONSES[Math.floor(Math.random() * PLAY_RESPONSES.length)];
          bubble.classList.add('show');
          setTimeout(() => bubble.classList.remove('show'), 1800);
        }, 300);
      }
    }

    // === Long-press hat picker ===
    let pressTimer = null;
    let pressStarted = false;
    let longPressTriggered = false;
    const PRESS_DURATION = 600;

    const spriteEl = document.getElementById('pet-sprite');
    const pressRing = document.getElementById('press-ring');

    function startPress(e) {
      if (e.button && e.button !== 0) return; // only left click
      pressStarted = true;
      longPressTriggered = false;

      // Position ring at press point
      const rect = spriteEl.getBoundingClientRect();
      const displayRect = document.querySelector('.lv-display').getBoundingClientRect();
      let cx, cy;
      if (e.touches) {
        cx = e.touches[0].clientX - displayRect.left;
        cy = e.touches[0].clientY - displayRect.top;
      } else {
        cx = e.clientX - displayRect.left;
        cy = e.clientY - displayRect.top;
      }
      pressRing.style.left = (cx - 45) + 'px';
      pressRing.style.top = (cy - 45) + 'px';
      pressRing.classList.add('active');

      pressTimer = setTimeout(() => {
        longPressTriggered = true;
        pressRing.classList.remove('active');
        openHatMenu();
      }, PRESS_DURATION);
    }

    function endPress() {
      pressStarted = false;
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      pressRing.classList.remove('active');
    }

    function onSpriteClick(e) {
      if (longPressTriggered) {
        e.preventDefault();
        e.stopPropagation();
        longPressTriggered = false;
        return;
      }
      // Normal click triggers talk
      action('talk');
    }

    spriteEl.addEventListener('mousedown', startPress);
    spriteEl.addEventListener('touchstart', startPress, { passive: true });
    window.addEventListener('mouseup', endPress);
    window.addEventListener('touchend', endPress);
    spriteEl.addEventListener('click', onSpriteClick);

    // Prevent context menu on long press
    spriteEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // === Hat menu ===
    const HAT_LIST = [
      { id: 'none', symbol: '—', label: '无' },
      { id: 'crown', symbol: '\\^^^/', label: '皇冠' },
      { id: 'tophat', symbol: '[___]', label: '礼帽' },
      { id: 'propeller', symbol: '-+-', label: '螺旋' },
      { id: 'halo', symbol: '(   )', label: '光环' },
      { id: 'wizard', symbol: '/^\\', label: '巫师' },
      { id: 'beanie', symbol: '(___)', label: '绒球' },
      { id: 'tinyduck', symbol: ',>', label: '小鸭' },
    ];

    function renderHatGrid() {
      const grid = document.getElementById('hat-grid');
      grid.innerHTML = HAT_LIST.map(h => `
        <div class="hat-option ${demoCompanion.hat === h.id ? 'active' : ''}" onclick="pickHat('${h.id}')" data-hat="${h.id}">
          <div>${h.symbol}</div>
          <div class="hat-label">${h.label}</div>
        </div>
      `).join('');
    }

    function openHatMenu() {
      renderHatGrid();
      document.getElementById('hat-menu').classList.add('open');
    }

    function closeHatMenu() {
      document.getElementById('hat-menu').classList.remove('open');
    }

    function pickHat(hatId) {
      demoCompanion.hat = hatId;
      renderSprite(demoCompanion);
      closeHatMenu();
    }

    // Init
    document.getElementById('pet-name').textContent = demoCompanion.name;
    const rarityClass = `r-${demoCompanion.rarity}`;
    document.getElementById('pet-rarity').className = `rarity-stars ${rarityClass}`;
    renderSprite(demoCompanion);
    startAnimation();
  </script>
</body>
</html>
