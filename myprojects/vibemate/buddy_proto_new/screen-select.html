<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buddy — 选择</title>
  <style>
    :root {
      --d: 360px; --r: 180px; --safe: 16px;
      --bg: #0A0A0F;
      --surface: #13131A;
      --fg: #E8E8ED;
      --muted: #6B6B78;
      --border: #252530;
      --accent: #3DD9D0;
      --accent-dim: rgba(61, 217, 208, 0.12);
      --btn-active: #2A2A38;
      --r-common: #8A8A95;
      --r-uncommon: #5EE7DF;
      --r-rare: #6B8CFF;
      --r-epic: #C85EFF;
      --r-legendary: #FFD166;
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'SF Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      display: grid; place-items: center;
      background: #050508;
      font-family: var(--font);
      overflow: hidden;
    }
    .lv-display {
      width: var(--d); height: var(--d);
      border-radius: 50%; overflow: hidden;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 0 2px var(--border), 0 20px 80px rgba(0,0,0,0.6);
    }
    .lv-label { color: var(--fg); font-size: 10px; line-height: 1.3; }
    .lv-label.muted { color: var(--muted); }
    .lv-label.title { font-size: 13px; font-weight: 600; }
    .lv-label.species-name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; }

    .lv-btn {
      display: grid; place-items: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .lv-btn:active { background: var(--btn-active); transform: scale(0.92); }
    .lv-btn.accent {
      background: var(--accent-dim);
      border-color: rgba(61,217,208,0.3);
      color: var(--accent);
      width: 44px; height: 44px;
    }
    .lv-btn.accent:active { background: rgba(61,217,208,0.25); }
    .lv-btn.nav-btn { width: 28px; height: 28px; }

    .screen {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      padding: var(--safe);
    }

    /* Header */
    .header {
      margin-top: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .header .subtitle {
      font-size: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 2px;
    }

    /* Carousel */
    .carousel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      min-height: 0;
      gap: 3px;
    }

    /* Center preview */
    .preview-stage {
      position: relative;
      width: 90px; height: 90px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .preview-ring {
      position: absolute;
      width: 78px; height: 78px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .hat-badge {
      position: absolute;
      top: 2px;
      font-size: 14px;
      line-height: 1;
      z-index: 3;
      transition: opacity 0.2s;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }
    .hat-badge.hidden { opacity: 0; pointer-events: none; }

    .preview-sprite {
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1.25;
      color: var(--fg);
      text-align: center;
      white-space: pre;
      z-index: 2;
    }

    .preview-name {
      text-align: center;
      flex-shrink: 0;
    }
    .preview-rarity {
      margin-top: 1px;
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* Selector rows */
    .selector-row {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 220px;
      padding: 0 14px;
      flex-shrink: 0;
    }
    .selector-label {
      font-size: 10px;
      color: var(--muted);
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      line-height: 1;
    }
    .selector-strip {
      display: flex;
      gap: 3px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .selector-strip::-webkit-scrollbar { display: none; }
    .opt {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--fg);
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .opt:active { transform: scale(0.88); }
    .opt.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }
    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .color-swatch:active { transform: scale(0.88); }
    .color-swatch.active {
      border-color: var(--fg);
      box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 2.5px var(--fg);
    }

    /* Side peek items */
    .side-peek {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--muted);
      opacity: 0.45;
    }
    .side-peek.left { left: 2px; }
    .side-peek.right { right: 2px; }

    /* Thumbnail strip */
    .thumb-strip {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .thumb {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid transparent;
      display: grid; place-items: center;
      font-family: var(--font-mono);
      font-size: 7px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .thumb.active {
      border-color: var(--accent);
      color: var(--fg);
    }

    /* Action bar */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    /* Page dots */
    .page-dots {
      position: absolute;
      bottom: 14px;
      display: flex;
      gap: 6px;
    }
    .page-dots .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s;
    }
    .page-dots .dot.active { background: var(--accent); }

    .r-common { color: var(--r-common); }
    .r-uncommon { color: var(--r-uncommon); }
    .r-rare { color: var(--r-rare); }
    .r-epic { color: var(--r-epic); }
    .r-legendary { color: var(--r-legendary); }

    @keyframes slideIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .preview-sprite { animation: slideIn 0.25s ease; }
  </style>
</head>
<body>
  <div class="lv-display">
    <div class="screen">
      <!-- Header -->
      <div class="header">
        <div class="lv-label title">选择伙伴</div>
        <div class="subtitle">自定义你的 Buddy</div>
      </div>

      <!-- Carousel -->
      <div class="carousel">
        <div class="side-peek left" id="peek-left"></div>
        <div class="side-peek right" id="peek-right"></div>

        <div class="preview-stage">
          <div class="hat-badge hidden" id="hat-badge"></div>
          <div class="preview-ring" id="preview-ring"></div>
          <div class="preview-sprite" id="preview-sprite"></div>
        </div>

        <div class="preview-name">
          <div class="lv-label species-name" id="preview-species">CAT</div>
          <div class="preview-rarity r-rare" id="preview-rarity">★★★</div>
        </div>

        <!-- Eye selector -->
        <div class="selector-row" id="eye-selector"></div>

        <!-- Hat selector -->
        <div class="selector-row" id="hat-selector"></div>

        <!-- Color selector -->
        <div class="selector-row" id="color-selector"></div>

        <!-- Thumbnail strip -->
        <div class="thumb-strip" id="thumb-strip"></div>
      </div>

      <!-- Action bar -->
      <div class="action-bar">
        <button class="lv-btn nav-btn" onclick="prev()" aria-label="上一个">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="lv-btn accent" onclick="generate()" aria-label="生成">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
        <button class="lv-btn nav-btn" onclick="next()" aria-label="下一个">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <!-- Page dots -->
      <div class="page-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>

  <script>
    const SPECIES = [
      'duck', 'goose', 'blob', 'cat', 'dragon', 'octopus',
      'owl', 'penguin', 'turtle', 'snail', 'ghost', 'axolotl',
      'capybara', 'cactus', 'robot', 'rabbit', 'mushroom', 'chonk'
    ];

    const RARITY_WEIGHTS = { common: 60, uncommon: 25, rare: 10, epic: 4, legendary: 1 };
    const RARITY_STARS = { common: '★', uncommon: '★★', rare: '★★★', epic: '★★★★', legendary: '★★★★★' };
    const EYES = ['·', '✦', '×', '◉', '@', '°'];
    const HATS = ['none', 'crown', 'tophat', 'propeller', 'halo', 'wizard', 'beanie', 'tinyduck'];
    const HAT_SYMBOLS = { none: '—', crown: '♔', tophat: '▲', propeller: '✱', halo: '○', wizard: '✦', beanie: '●', tinyduck: 'd' };
    const COLORS = [
      { name: 'cyan', hex: '#3DD9D0' },
      { name: 'pink', hex: '#FF6B9D' },
      { name: 'gold', hex: '#FFD166' },
      { name: 'purple', hex: '#C85EFF' },
      { name: 'green', hex: '#5EE7A0' },
      { name: 'blue', hex: '#6B8CFF' },
      { name: 'orange', hex: '#FF9F43' },
      { name: 'white', hex: '#E8E8ED' },
    ];

    const FACE_PREVIEW = {
      duck: '<(·)', goose: '(·>)', blob: '(··)', cat: '(=ω=)',
      dragon: '<~~>', octopus: '~(··)~', owl: '(··)', penguin: '(·>)',
      turtle: '[_ _]', snail: '·(@)', ghost: '/··\\', axolotl: '}··{',
      capybara: '(oo)', cactus: '|··|', robot: '[··]', rabbit: '(..)',
      mushroom: '|··|', chonk: '(..)',
    };

    const MINI_ICON = {
      duck: 'D', goose: 'G', blob: 'O', cat: 'C', dragon: 'R',
      octopus: '8', owl: 'o', penguin: 'P', turtle: 'T', snail: '@',
      ghost: '~', axolotl: 'A', capybara: 'B', cactus: '#', robot: '◈',
      rabbit: 'R', mushroom: 'M', chonk: '=',
    };

    let currentIdx = 3;
    let selectedEye = 0;
    let selectedHat = 0;
    let selectedColor = 0;

    function seededRandom(seed) {
      let s = seed >>> 0;
      return function() {
        s |= 0; s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hashString(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function rollRarity(rng) {
      const total = Object.values(RARITY_WEIGHTS).reduce((a,b) => a+b, 0);
      let roll = rng() * total;
      for (const r of Object.keys(RARITY_WEIGHTS)) {
        roll -= RARITY_WEIGHTS[r];
        if (roll < 0) return r;
      }
      return 'common';
    }

    function rollCompanion(species) {
      const rng = seededRandom(hashString(species + Date.now()));
      return {
        species,
        rarity: rollRarity(rng),
        eye: Math.floor(rng() * EYES.length),
        hat: Math.floor(rng() * HATS.length),
        color: Math.floor(rng() * COLORS.length),
        shiny: rng() < 0.05,
      };
    }

    function getActiveColor() {
      return COLORS[selectedColor].hex;
    }

    function renderPreview() {
      const species = SPECIES[currentIdx];
      const eyeChar = EYES[selectedEye];
      const color = getActiveColor();

      const spriteEl = document.getElementById('preview-sprite');
      const face = FACE_PREVIEW[species] || '(··)';
      spriteEl.innerHTML = face.replace(/·/g, `<span style="color:${color}">${eyeChar}</span>`);

      document.getElementById('preview-species').textContent = species.toUpperCase();

      // Deterministic rarity per species
      const rng = seededRandom(hashString(species + 'rarity'));
      const rarity = rollRarity(rng);
      const rEl = document.getElementById('preview-rarity');
      rEl.textContent = RARITY_STARS[rarity];
      rEl.className = 'preview-rarity r-' + rarity;

      // Update ring color
      const ring = document.getElementById('preview-ring');
      ring.style.borderColor = color;
      ring.style.boxShadow = `0 0 14px ${color}18`;

      // Hat badge
      const hatBadge = document.getElementById('hat-badge');
      const hatName = HATS[selectedHat];
      if (hatName === 'none') {
        hatBadge.classList.add('hidden');
      } else {
        hatBadge.classList.remove('hidden');
        hatBadge.textContent = HAT_SYMBOLS[hatName];
        hatBadge.style.color = color;
      }

      // Side peeks
      const leftIdx = (currentIdx - 1 + SPECIES.length) % SPECIES.length;
      const rightIdx = (currentIdx + 1) % SPECIES.length;
      document.getElementById('peek-left').textContent = MINI_ICON[SPECIES[leftIdx]];
      document.getElementById('peek-right').textContent = MINI_ICON[SPECIES[rightIdx]];

      renderThumbs();
    }

    function renderSelectors() {
      // Eyes
      const eyeRow = document.getElementById('eye-selector');
      eyeRow.innerHTML = '<div class="selector-label">◉</div>';
      const eyeStrip = document.createElement('div');
      eyeStrip.className = 'selector-strip';
      EYES.forEach((eye, i) => {
        const btn = document.createElement('div');
        btn.className = 'opt' + (i === selectedEye ? ' active' : '');
        btn.textContent = eye;
        btn.style.fontSize = '11px';
        btn.onclick = () => { selectedEye = i; renderSelectors(); renderPreview(); };
        eyeStrip.appendChild(btn);
      });
      eyeRow.appendChild(eyeStrip);

      // Hats
      const hatRow = document.getElementById('hat-selector');
      hatRow.innerHTML = '<div class="selector-label">▲</div>';
      const hatStrip = document.createElement('div');
      hatStrip.className = 'selector-strip';
      HATS.forEach((hat, i) => {
        const btn = document.createElement('div');
        btn.className = 'opt' + (i === selectedHat ? ' active' : '');
        btn.textContent = HAT_SYMBOLS[hat];
        btn.style.fontSize = '10px';
        btn.onclick = () => { selectedHat = i; renderSelectors(); renderPreview(); };
        hatStrip.appendChild(btn);
      });
      hatRow.appendChild(hatStrip);

      // Colors
      const colorRow = document.getElementById('color-selector');
      colorRow.innerHTML = '<div class="selector-label">●</div>';
      const colorStrip = document.createElement('div');
      colorStrip.className = 'selector-strip';
      COLORS.forEach((c, i) => {
        const btn = document.createElement('div');
        btn.className = 'color-swatch' + (i === selectedColor ? ' active' : '');
        btn.style.background = c.hex;
        btn.onclick = () => { selectedColor = i; renderSelectors(); renderPreview(); };
        colorStrip.appendChild(btn);
      });
      colorRow.appendChild(colorStrip);
    }

    function renderThumbs() {
      const strip = document.getElementById('thumb-strip');
      strip.innerHTML = '';
      for (let i = -2; i <= 2; i++) {
        const idx = (currentIdx + i + SPECIES.length) % SPECIES.length;
        const thumb = document.createElement('div');
        thumb.className = 'thumb' + (i === 0 ? ' active' : '');
        thumb.textContent = MINI_ICON[SPECIES[idx]];
        thumb.onclick = () => { currentIdx = idx; renderPreview(); };
        strip.appendChild(thumb);
      }
    }

    function prev() {
      currentIdx = (currentIdx - 1 + SPECIES.length) % SPECIES.length;
      renderPreview();
    }
    function next() {
      currentIdx = (currentIdx + 1) % SPECIES.length;
      renderPreview();
    }
    function generate() {
      const rolled = rollCompanion(SPECIES[currentIdx]);
      selectedEye = rolled.eye;
      selectedHat = rolled.hat;
      selectedColor = rolled.color;

      const ring = document.getElementById('preview-ring');
      ring.style.transform = 'scale(1.08)';
      setTimeout(() => {
        ring.style.transform = 'scale(1)';
        renderSelectors();
        renderPreview();
      }, 180);
    }

    // Swipe support
    let touchStartX = 0;
    const display = document.querySelector('.lv-display');
    display.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
    display.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 30) dx > 0 ? prev() : next();
    });

    // Initialize
    renderSelectors();
    renderPreview();
  </script>
</body>
</html>
