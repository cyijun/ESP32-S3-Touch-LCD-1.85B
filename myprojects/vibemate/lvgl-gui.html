<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kimi Coding Plan - LVGL 圆形 GUI</title>
<style>
  :root {
    /* 深色科技仪表调色板 */
    --bg: #0a0e17;
    --surface: #111827;
    --fg: #f0f4f8;
    --muted: #94a3b8;
    --border: #1e293b;
    --accent-week: oklch(68% 0.16 220);
    --accent-window: oklch(70% 0.18 55);
    --track: #1e293b;
    --success: oklch(65% 0.15 145);
    --warning: oklch(70% 0.18 55);
    --danger: oklch(55% 0.20 25);
    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #05080f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    overflow: hidden;
  }

  /* 圆形屏幕外壳 */
  .device-shell {
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: linear-gradient(145deg, #0f1724, #070a10);
    box-shadow:
      0 0 0 2px #1e293b,
      0 0 0 6px #0f1724,
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 2px 4px rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 360x360 圆形画布 */
  .round-screen {
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
  }

  /* 装饰性刻度环 */
  .tick-ring {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 340px;
    height: 340px;
    pointer-events: none;
  }

  /* 主内容层 */
  .gui-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 标题区 */
  .header {
    position: absolute;
    top: 44px;
    text-align: center;
  }
  .header-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .header-value {
    font-size: 13px;
    color: var(--fg);
    margin-top: 2px;
    font-family: var(--font-mono);
  }

  /* 圆弧仪表盘区 */
  .gauge-area {
    position: relative;
    width: 280px;
    height: 280px;
    margin-top: 8px;
  }

  .gauge-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .gauge-svg .track {
    fill: none;
    stroke: var(--track);
    stroke-linecap: round;
  }

  .gauge-svg .indicator {
    fill: none;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .gauge-svg .indicator-week {
    stroke: var(--accent-week);
    filter: drop-shadow(0 0 3px oklch(68% 0.16 220 / 0.4));
  }

  .gauge-svg .indicator-window {
    stroke: var(--accent-window);
    filter: drop-shadow(0 0 2px oklch(70% 0.18 55 / 0.35));
  }

  /* 中心数据 */
  .center-info {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .center-percent {
    font-size: 42px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .center-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  .center-sub {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    font-family: var(--font-mono);
    opacity: 0.7;
  }

  /* 底部图例 */
  .legend {
    position: absolute;
    bottom: 38px;
    display: flex;
    gap: 20px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .legend-dot.week { background: var(--accent-week); }
  .legend-dot.window { background: var(--accent-window); }

  .legend-text {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  /* 状态指示点 */
  .status-dot {
    position: absolute;
    top: 18px;
    right: 48px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 4px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* 提示 */
  .hint {
    position: absolute;
    bottom: -36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #475569;
    white-space: nowrap;
  }

  /* 数据模拟切换 */
  .data-toggle {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .data-toggle button {
    padding: 6px 14px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-display);
  }

  .data-toggle button.active {
    background: var(--surface);
    color: var(--fg);
  }

  .data-toggle button:hover {
    color: var(--fg);
  }
</style>

<body>

<div class="device-shell" data-od-id="path-0">
  <div class="round-screen">
    <!-- 刻度环 SVG -->
    <svg class="tick-ring" viewBox="0 0 340 340">
      <defs>
        <filter id="glow-week" x="-20%" y="-20%" width="140%" height="140%" data-od-id="path-0-0-0-0-0">
          <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
          <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
        </filter>
      </defs>
      <!-- 外圈刻度 -->
      <g id="ticks-outer" data-od-id="path-0-0-0-1"></g>
    </svg>

    <div class="gui-content">
      <!-- 状态指示 -->
      <div class="status-dot" id="statusDot" data-od-id="path-0-0-1-0"></div>

      <!-- 顶部标题 -->
      <div class="header">
        <div class="header-label">Kimi Coding Plan</div>
        <div class="header-value" id="planTier" data-od-id="path-0-0-1-1-1">Allegro</div>
      </div>

      <!-- 双圆弧仪表 -->
      <div class="gauge-area">
        <svg class="gauge-svg" viewBox="0 0 280 280">
          <!-- 外圈：周用量 -->
          <circle class="track" cx="140" cy="140" r="118" stroke-width="14"></circle>
          <circle class="indicator indicator-week" cx="140" cy="140" r="118" stroke-width="14" stroke-dasharray="741" stroke-dashoffset="741" id="arcWeek" data-od-id="path-0-0-1-2-0-1"></circle>

          <!-- 内圈：5小时窗口 -->
          <circle class="track" cx="140" cy="140" r="94" stroke-width="10"></circle>
          <circle class="indicator indicator-window" cx="140" cy="140" r="94" stroke-width="10" stroke-dasharray="590" stroke-dashoffset="590" id="arcWindow" data-od-id="path-0-0-1-2-0-3"></circle>
        </svg>

        <!-- 中心信息 -->
        <div class="center-info">
          <div class="center-percent" id="centerValue" data-od-id="path-0-0-1-2-1-0">32%</div>
          <div class="center-label" id="centerLabel" data-od-id="path-0-0-1-2-1-1">周用量已用</div>
        </div>
      </div>

      <!-- 底部图例 -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot week"></div>
          <span class="legend-text">7天</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot window"></div>
          <span class="legend-text">5小时</span>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">360 × 360 圆形屏幕 · LVGL Arc</div>
</div>

<!-- 数据场景切换 -->
<div class="data-toggle" data-od-id="path-1">
  <button class="active" onclick="setScenario('normal')" id="btn-normal" data-od-id="path-1-0">正常使用</button>
  <button onclick="setScenario('heavy')" id="btn-heavy" data-od-id="path-1-1">高频使用</button>
  <button onclick="setScenario('critical')" id="btn-critical" data-od-id="path-1-2">接近限额</button>
</div>

<script>
  // 圆弧参数
  const R_WEEK = 118;
  const R_WINDOW = 94;
  const C_WEEK = 2 * Math.PI * R_WEEK;   // ~741
  const C_WINDOW = 2 * Math.PI * R_WINDOW; // ~590

  // 场景数据（百分比显示已用量）
  const scenarios = {
    normal: {
      weekUsed: 0.32,
      windowUsed: 0.45,
      weekLabel: '周用量已用',
      centerValue: '32%',
      tier: 'Allegro',
      status: 'success'
    },
    heavy: {
      weekUsed: 0.65,
      windowUsed: 0.82,
      weekLabel: '周用量已用',
      centerValue: '65%',
      tier: 'Allegro',
      status: 'warning'
    },
    critical: {
      weekUsed: 0.91,
      windowUsed: 0.95,
      weekLabel: '周用量已用',
      centerValue: '91%',
      tier: 'Allegro',
      status: 'danger'
    }
  };

  function setScenario(name) {
    const s = scenarios[name];
    const arcWeek = document.getElementById('arcWeek');
    const arcWindow = document.getElementById('arcWindow');

    // 计算 stroke-dashoffset: offset = C * (1 - used)
    const offWeek = C_WEEK * (1 - s.weekUsed);
    const offWindow = C_WINDOW * (1 - s.windowUsed);

    arcWeek.style.strokeDashoffset = offWeek;
    arcWindow.style.strokeDashoffset = offWindow;

    document.getElementById('centerValue').textContent = s.centerValue;
    document.getElementById('centerLabel').textContent = s.weekLabel;
    document.getElementById('planTier').textContent = s.tier;

    // 状态点颜色
    const statusDot = document.getElementById('statusDot');
    const colors = {
      success: 'var(--success)',
      warning: 'var(--warning)',
      danger: 'var(--danger)'
    };
    statusDot.style.background = colors[s.status];
    statusDot.style.boxShadow = `0 0 4px ${colors[s.status]}`;

    // 按钮状态
    document.querySelectorAll('.data-toggle button').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + name).classList.add('active');
  }

  // 绘制外圈刻度
  function drawTicks() {
    const g = document.getElementById('ticks-outer');
    const cx = 170, cy = 170, r = 160;
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * 360;
      const rad = (angle - 90) * Math.PI / 180;
      const isMajor = i % 5 === 0;
      const len = isMajor ? 6 : 3;
      const x1 = cx + Math.cos(rad) * (r - len);
      const y1 = cy + Math.sin(rad) * (r - len);
      const x2 = cx + Math.cos(rad) * r;
      const y2 = cy + Math.sin(rad) * r;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', isMajor ? '#334155' : '#1e293b');
      line.setAttribute('stroke-width', isMajor ? '1.5' : '1');
      g.appendChild(line);
    }
  }

  // 初始化
  drawTicks();
  setTimeout(() => setScenario('normal'), 100);
</script>
